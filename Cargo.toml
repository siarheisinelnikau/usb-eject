[package]
name = "usb-eject"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A conservative native Windows external-drive ejection utility"
autobins = false

[lib]
name = "usb_eject"

[[bin]]
name = "UsbEject"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
png = "0.18"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_IO", "Win32_System_Ioctl",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_RestartManager",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_Environment", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
strip = "debuginfo"

