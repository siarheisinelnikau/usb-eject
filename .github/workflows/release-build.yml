name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Provision shared updater source
      shell: pwsh
      run: ./scripts/provision-shared-updater.ps1
    - name: Require the shared updater sibling checkout
      run: |
        if (-not (Test-Path -LiteralPath ../rust-auto-updator/crates/rust-auto-updator/Cargo.toml)) {
          throw 'Provision rust-auto-updator beside this repository before verification. The shared crate is currently a local dependency; no remote source has been published.'
        }
    - name: Install the stable Rust toolchain
      run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
    - name: Format, lint and test isolated fixtures
      run: ./scripts/verify.ps1
    - name: Build portable executable and notices
      run: ./scripts/package.ps1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: UsbEject-windows-x64-review-build
        path: dist/*
        if-no-files-found: error
        retention-days: 14
    permissions:
      contents: read
