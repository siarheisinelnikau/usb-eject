name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - name: Require the shared updater sibling checkout
        run: |
          if (-not (Test-Path -LiteralPath ../rust-auto-updator/crates/rust-auto-updator/Cargo.toml)) {
            throw 'Provision rust-auto-updator beside this repository before verification. The shared crate is currently a local dependency; no remote source has been published.'
          }
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format, lint and test isolated fixtures
        run: ./scripts/verify.ps1
      - name: Build portable executable and notices
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: UsbEject-windows-x64-review-build
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  localization-release:
    name: Publish the explicitly requested localization release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release localization v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: localization-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: UsbEject-windows-x64-review-build
          path: .release-input
      - name: Verify the checked executable, companion and notices
        shell: pwsh
        run: ./scripts/stage-localization-release.ps1
      - name: Publish only after every asset is verified
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-localization-release.cjs');
            await publish({github, context, core});
